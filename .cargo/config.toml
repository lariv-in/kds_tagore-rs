# Always-on project config. .cargo/lariv-paths.toml is included while it is
# present. scripts/lariv-source git moves that file aside.

# include = [{ path = "lariv-paths.toml", optional = true }]

# The full plugin chain's trait proofs recurse past rustc's default stack and
# SIGSEGV. Cargo applies this to rustc.
[env]
RUST_MIN_STACK = { value = "134217728", force = true }
