[package]
name = "kds_tagore-rs"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "kds-tagore-rs"
path = "src/main.rs"

[dependencies]
lariv-rs = { version = "0.1.0",
	# path = "../../lariv-rs",
	git = "https://github.com/lariv-in/lariv-rs", rev = "d25b867b7136c722eac66df23ce5ec5699784f0f",
	default-features = false, features = [
		"plugin-users",
		"plugin-dashboard",
		"plugin-filesystem",
		"plugin-website",
		"plugin-crm",
		"plugin-finance",
		"plugin-forms",
		"plugin-llm-assistant",
] }
tokio = { version = "1", features = ["full"] }
anyhow = { version = "1", features = ["backtrace"] }
async-trait = "0.1"
frunk = { version = "0.5.0", features = ["serde", "std"] }
frunk_core = "0.5.0"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing = "0.1"
chrono = { version = "0.4", features = ["serde", "clock"] }
axum = { version = "0.8", features = ["form", "macros"] }
maud = { version = "0.27", features = ["axum"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust_decimal = { version = "1", features = ["serde-with-str", "maths"] }
sea-orm = { version = "1.1", features = [
	"runtime-tokio-rustls",
	"sqlx-postgres",
	"sqlx-sqlite",
	"macros",
	"with-chrono",
	"with-rust_decimal",
] }
sea-orm-migration = { version = "1.1", features = [
	"sqlx-postgres",
	"sqlx-sqlite",
	"runtime-tokio-rustls",
	"with-rust_decimal",
] }
calamine = "0.26"
rust_xlsxwriter = "0.79"
stl_io = "0.11"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
minijinja = { version = "2", features = ["loader"] }
num2words = "1"

[dev-dependencies]
uuid = { version = "1", features = ["v4"] }
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
