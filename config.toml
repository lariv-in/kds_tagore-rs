database_url = "postgres://postgres:0708@localhost:5432/kds_tagore"
bind = "0.0.0.0:42070"

[users]
adminEmail = "admin@example.com"
adminPassword = "adminadmin"
signingKey = ""
jwtIssuer = ""

[meets]
anonCookieSecret = "kds-tagore-local-dev-meets-secret"

[filesystem]
storageBackend = "local"
localDir = "filesystem"

[website]
newPageRootDir = "website/pages"
assetsDir = "website/assets"

# Embedded moq-relay (QUIC + HTTPS/WebTransport + WebSocket fallback).
[meets.transport]
enabled = true
bind = "[::]:4433"
certFile = "dev/certs/cert.pem"
keyFile = "dev/certs/key.pem"
# Direct MoQ relay URL (not Caddy). Prefer 127.0.0.1 over localhost to avoid IPv6/IPv4 mismatch.
publicUrl = "https://127.0.0.1:4433"
# Persistent JWT signing key (created by ./dev/setup-certs.sh). Omit to use an ephemeral dev key.
authKeyFile = "dev/certs/moq-auth.jwk"
