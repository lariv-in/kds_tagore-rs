name: CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  check:
    # ubuntu-latest is Ubuntu 26.04 (glibc 2.43). Release binaries from that
    # image need GLIBC_2.43 from libm and do not start on Debian (glibc 2.41).
    # 24.04 ships glibc 2.39, which those images can load.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-08-27
          components: rustc-codegen-cranelift-preview
      - run: sudo apt-get update && sudo apt-get install -y libarchive-dev
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: check
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - run: cargo check --workspace

  # Warm Release-Cache on master (tags can restore it) and upload the LTO'd
  # binary so tag releases can skip cargo/LTO entirely for the same commit.
  release-cache:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-08-27
      - uses: swatinem/rust-cache@v2
        with:
          shared-key: Release-Cache
          add-rust-environment-hash-key: false
          cache-workspace-crates: true
          cache-on-failure: true
      - run: sudo apt-get update && sudo apt-get install -y libarchive-dev
      - run: cargo build --release
      - name: require glibc <= 2.41
        run: |
          set -euo pipefail
          bin=target/release/kds-tagore-rs
          need="$(objdump -T "$bin" | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sort -uV | tail -1 || true)"
          echo "highest glibc symbol: ${need:-none}"
          if [ -z "$need" ] || [ "$(printf '%s\n%s\n' "$need" 'GLIBC_2.41' | sort -V | tail -1)" != 'GLIBC_2.41' ]; then
            echo "::error::${bin} requires ${need:-an unknown glibc}; Debian deploy images have 2.41"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: kds-tagore-rs-${{ github.sha }}
          path: target/release/kds-tagore-rs
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
