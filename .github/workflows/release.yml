name: release

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      is_tagged: ${{ steps.check.outputs.is_tagged }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: check
        run: |
          if [ -n "$(git tag --points-at HEAD 'v*')" ]; then
            echo "is_tagged=true" >> "$GITHUB_OUTPUT"
          fi

  build-and-release:
    needs: gate
    if: needs.gate.outputs.is_tagged == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install rust nightly
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-08-11

      - name: rust cache
        uses: swatinem/rust-cache@v2
        shared-key: "Release-Cache"

      - name: build release binary
        run: cargo build --release

      - name: create release
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/kds_tagore-rs
          generate_release_notes: true
