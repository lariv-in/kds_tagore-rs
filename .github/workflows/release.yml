name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build-and-release:
    # Same glibc pin as CI: ubuntu-latest (26.04) links libm at GLIBC_2.43.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: restore binary built on master
        id: prebuilt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p target/release
          run_id="$(
            gh run list \
              --workflow CI \
              --commit "${{ github.sha }}" \
              --limit 10 \
              --json databaseId,status,conclusion \
              --jq '[.[] | select(.conclusion == "success")][0].databaseId
                // [.[] | select(.status == "in_progress" or .status == "queued" or .status == "pending")][0].databaseId
                // empty'
          )"
          if [ -z "$run_id" ]; then
            echo "No CI run for ${{ github.sha }}"
            echo "hit=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Using CI run $run_id"
          conclusion="$(gh run view "$run_id" --json conclusion --jq '.conclusion')"
          if [ "$conclusion" != "success" ]; then
            if ! gh run watch "$run_id" --exit-status; then
              echo "CI run failed"
              echo "hit=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          tmp="$(mktemp -d)"
          if gh run download "$run_id" -n "kds-tagore-rs-${{ github.sha }}" -D "$tmp"; then
            find "$tmp" -type f -name kds-tagore-rs -exec cp {} target/release/kds-tagore-rs \;
            chmod +x target/release/kds-tagore-rs
            test -x target/release/kds-tagore-rs
            echo "hit=true" >> "$GITHUB_OUTPUT"
          else
            echo "hit=false" >> "$GITHUB_OUTPUT"
          fi

      - name: keep the prebuilt binary only if Debian can load it
        id: ship
        run: |
          set -euo pipefail
          bin=target/release/kds-tagore-rs
          if [ ! -x "$bin" ]; then
            echo "rebuild=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          need="$(objdump -T "$bin" | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sort -uV | tail -1 || true)"
          echo "prebuilt highest glibc symbol: ${need:-none}"
          if [ -n "$need" ] && [ "$(printf '%s\n%s\n' "$need" 'GLIBC_2.41' | sort -V | tail -1)" = 'GLIBC_2.41' ]; then
            echo "rebuild=false" >> "$GITHUB_OUTPUT"
          else
            echo "prebuilt needs ${need:-an unknown glibc}; rebuilding on ubuntu-24.04"
            rm -f "$bin"
            echo "rebuild=true" >> "$GITHUB_OUTPUT"
          fi

      - name: install rust nightly
        if: steps.ship.outputs.rebuild == 'true'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-08-27

      - name: rust cache
        if: steps.ship.outputs.rebuild == 'true'
        uses: swatinem/rust-cache@v2
        with:
          shared-key: Release-Cache
          add-rust-environment-hash-key: false
          cache-workspace-crates: true
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: install libarchive
        if: steps.ship.outputs.rebuild == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-dev

      - name: build release binary
        if: steps.ship.outputs.rebuild == 'true'
        run: cargo build --release

      - name: require glibc <= 2.41
        run: |
          set -euo pipefail
          bin=target/release/kds-tagore-rs
          need="$(objdump -T "$bin" | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sort -uV | tail -1 || true)"
          echo "highest glibc symbol: ${need:-none}"
          if [ -z "$need" ] || [ "$(printf '%s\n%s\n' "$need" 'GLIBC_2.41' | sort -V | tail -1)" != 'GLIBC_2.41' ]; then
            echo "::error::${bin} requires ${need:-an unknown glibc}; Debian deploy images have 2.41"
            exit 1
          fi

      - name: create release
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/kds-tagore-rs
          generate_release_notes: true
